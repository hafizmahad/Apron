# Apron Production — security scanning.
#
# CLAUDE.md §27 requires gitleaks in CI, Trivy image scanning and dependency scanning.
# Each tool runs from its own pinned container rather than a marketplace action, so what
# runs is visible in the diff and upgrading is an explicit edit rather than a moving tag.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Dependency advisories land after a commit does. Re-scan the unchanged tree weekly,
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree. A secret committed and then
          # removed is still a leaked secret.
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose --exit-code=1

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Production dependencies are what ships. A high-severity advisory in the runtime
      # tree fails the build; devDependencies are reported without failing it, because a
      # test-only advisory should not block a deploy at 2am.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=moderate || true

  images:
    name: Image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: apron-${{ matrix.target }}:scan
          cache-from: type=gha,scope=${{ matrix.target }}
      - name: Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              apron-${{ matrix.target }}:scan
