<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1430" width="1640" height="1430" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Apron — high-level architecture</title>
  <desc>How a ground-services request travels from one written sentence to confirmed suppliers, and which part of the system is responsible for each step.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .band       { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
    .bandfill   { fill: #f4f4f4; stroke: #000000; stroke-width: 1.6; }
    .inner      { fill: #ffffff; stroke: #666666; stroke-width: 1.1; }
    .innerfill  { fill: #ececec; stroke: #666666; stroke-width: 1.1; }
    .gate       { fill: #e2e2e2; stroke: #000000; stroke-width: 2.2; }
    .h          { font-size: 19px; font-weight: 700; fill: #000; }
    .hs         { font-size: 15px; font-weight: 700; fill: #000; }
    .t          { font-size: 13.5px; fill: #111; }
    .ts         { font-size: 12.5px; fill: #333; }
    .tiny       { font-size: 11.5px; fill: #444; }
    .mono       { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #222; }
    .lbl        { font-size: 12px; font-weight: 700; fill: #000; letter-spacing: 1.2px; }
    .flow       { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .flowback   { stroke: #555; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowOpen); }
    .num        { fill: #000; }
    .numt       { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .rule       { stroke: #000; stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="1640" height="1430" fill="#ffffff"/>

  <!-- ─────────────── title ─────────────── -->
  <text x="40" y="46" class="h" font-size="27">Apron — how the system fits together</text>
  <text x="40" y="70" class="ts">Ground-services coordination for private aviation. One sentence in; confirmed suppliers, with named vehicles and people, out.</text>
  <line x1="40" y1="84" x2="1600" y2="84" class="rule"/>

  <!-- ─────────────── 1. people and portals ─────────────── -->
  <text x="40" y="112" class="lbl">WHO USES IT</text>

  <rect x="40"   y="124" width="360" height="112" class="band" rx="3"/>
  <text x="60"   y="150" class="hs">Client portal</text>
  <text x="60"   y="172" class="t">The client booking the trip</text>
  <text x="60"   y="194" class="ts">Writes one sentence, answers what is</text>
  <text x="60"   y="212" class="ts">still needed, confirms, follows progress</text>

  <rect x="440"  y="124" width="360" height="112" class="band" rx="3"/>
  <text x="460"  y="150" class="hs">Operations portal</text>
  <text x="460"  y="172" class="t">The internal dispatch team</text>
  <text x="460"  y="194" class="ts">Whole lifecycle, timeline, decision trace,</text>
  <text x="460"  y="212" class="ts">manual intervention, research assistant</text>

  <rect x="840"  y="124" width="360" height="112" class="band" rx="3"/>
  <text x="860"  y="150" class="hs">Provider portal</text>
  <text x="860"  y="172" class="t">Each supplier company</text>
  <text x="860"  y="194" class="ts">Accepts or declines, assigns the actual</text>
  <text x="860"  y="212" class="ts">vehicle, driver or officer</text>

  <rect x="1240" y="124" width="360" height="112" class="band" rx="3"/>
  <text x="1260" y="150" class="hs">Admin console</text>
  <text x="1260" y="172" class="t">Platform governance</text>
  <text x="1260" y="194" class="ts">Approves suppliers, service catalogue,</text>
  <text x="1260" y="212" class="ts">airport registry, users, audit trail</text>

  <!-- arrows down into the gate -->
  <path d="M 220 236 L 220 272"  class="flow"/>
  <path d="M 620 236 L 620 272"  class="flow"/>
  <path d="M 1020 236 L 1020 272" class="flow"/>
  <path d="M 1420 236 L 1420 272" class="flow"/>

  <!-- ─────────────── 2. the gate ─────────────── -->
  <rect x="40" y="276" width="1560" height="62" class="gate" rx="3"/>
  <text x="60" y="303" class="hs">Authentication and permissions — checked on the server for every action</text>
  <text x="60" y="325" class="ts">Opaque session cookie · argon2id passwords · 37 permissions across 7 roles · a provider can only ever reach its own company's data. Hiding a link is not a control.</text>
  <circle cx="1556" cy="307" r="15" class="num"/><text x="1556" y="312" class="numt">1</text>

  <!-- ─────────────── 3. application layer ─────────────── -->
  <text x="40" y="372" class="lbl">APPLICATION — Next.js App Router, server-side</text>

  <rect x="40" y="384" width="1560" height="86" class="band" rx="3"/>
  <rect x="58" y="400" width="290" height="54" class="inner" rx="3"/>
  <text x="72" y="421" class="hs">Server actions</text>
  <text x="72" y="441" class="ts">every mutation, validated at the edge</text>

  <rect x="368" y="400" width="290" height="54" class="inner" rx="3"/>
  <text x="382" y="421" class="hs">Route handlers</text>
  <text x="382" y="441" class="ts">health, document download</text>

  <rect x="678" y="400" width="290" height="54" class="inner" rx="3"/>
  <text x="692" y="421" class="hs">Server components</text>
  <text x="692" y="441" class="ts">read straight from the database</text>

  <rect x="988" y="400" width="290" height="54" class="innerfill" rx="3"/>
  <text x="1002" y="421" class="hs">Intake + clarification</text>
  <text x="1002" y="441" class="ts">asks for what configuration requires</text>

  <rect x="1298" y="400" width="284" height="54" class="inner" rx="3"/>
  <text x="1312" y="421" class="hs">Rate limiting</text>
  <text x="1312" y="441" class="ts">per user, on model-backed paths</text>

  <path d="M 420 470 L 420 512" class="flow"/>
  <path d="M 1180 470 L 1180 512" class="flow"/>

  <!-- ─────────────── 4. the two halves ─────────────── -->
  <text x="40" y="546" class="lbl">THE DIVISION THAT MAKES IT TRUSTWORTHY</text>

  <!-- deterministic core -->
  <rect x="40" y="558" width="790" height="268" class="band" rx="3"/>
  <text x="60" y="586" class="hs">Deterministic core — decides everything that matters</text>
  <text x="60" y="608" class="ts">Pure functions. No database, no clock, no network, no randomness. Given the same</text>
  <text x="60" y="626" class="ts">snapshot it always answers the same way, so it can be tested exhaustively.</text>

  <rect x="60" y="642" width="240" height="72" class="inner" rx="3"/>
  <text x="74" y="664" class="hs">Eligibility</text>
  <text x="74" y="683" class="tiny">approved · covers this airport · open</text>
  <text x="74" y="700" class="tiny">· lead time · capacity · resource free</text>

  <rect x="316" y="642" width="240" height="72" class="inner" rx="3"/>
  <text x="330" y="664" class="hs">Ranking</text>
  <text x="330" y="683" class="tiny">spare capacity, platform rank, lead-time</text>
  <text x="330" y="700" class="tiny">margin, same-supplier consolidation</text>

  <rect x="572" y="642" width="238" height="72" class="inner" rx="3"/>
  <text x="586" y="664" class="hs">Reason codes</text>
  <text x="586" y="683" class="tiny">why each supplier was rejected —</text>
  <text x="586" y="700" class="tiny">recorded, not discarded</text>

  <rect x="60" y="726" width="368" height="80" class="inner" rx="3"/>
  <text x="74" y="748" class="hs">Time</text>
  <text x="74" y="768" class="tiny">Stored in UTC, shown in the airport's zone. Local time is</text>
  <text x="74" y="785" class="tiny">converted only after the airport is known. A time that is</text>
  <text x="74" y="800" class="tiny">ambiguous or does not exist is asked about, never moved.</text>

  <rect x="444" y="726" width="366" height="80" class="inner" rx="3"/>
  <text x="458" y="748" class="hs">State machines</text>
  <text x="458" y="768" class="tiny">Explicit transitions for the request and for each service</text>
  <text x="458" y="785" class="tiny">line. A status is never assigned directly; the request's</text>
  <text x="458" y="800" class="tiny">own status is derived from its lines.</text>

  <circle cx="806" cy="586" r="15" class="num"/><text x="806" y="591" class="numt">4</text>

  <!-- AI boundary -->
  <rect x="860" y="558" width="740" height="268" class="bandfill" rx="3"/>
  <text x="880" y="586" class="hs">Language model — helps, never decides</text>
  <text x="880" y="608" class="ts">Reaches the product through one adapter. It cannot write to the database, cannot</text>
  <text x="880" y="626" class="ts">see suppliers that failed eligibility, and cannot name anything code did not supply.</text>

  <rect x="880" y="642" width="228" height="72" class="inner" rx="3"/>
  <text x="894" y="664" class="hs">Reads the sentence</text>
  <text x="894" y="683" class="tiny">into tokens — never an ICAO code,</text>
  <text x="894" y="700" class="tiny">never an id, never an instant</text>

  <rect x="1124" y="642" width="228" height="72" class="inner" rx="3"/>
  <text x="1138" y="664" class="hs">Chooses a supplier</text>
  <text x="1138" y="683" class="tiny">only from the shortlist eligibility</text>
  <text x="1138" y="700" class="tiny">already proved is valid</text>

  <rect x="1368" y="642" width="214" height="72" class="inner" rx="3"/>
  <text x="1382" y="664" class="hs">Answers questions</text>
  <text x="1382" y="683" class="tiny">read-only, from the request's own</text>
  <text x="1382" y="700" class="tiny">trace. Refuses to take action.</text>

  <rect x="880" y="726" width="702" height="80" class="inner" rx="3"/>
  <text x="894" y="748" class="hs">Every answer is checked before it is used</text>
  <text x="894" y="768" class="tiny">Schema validated → the chosen supplier must be on the shortlist → it must still pass the same eligibility snapshot.</text>
  <text x="894" y="785" class="tiny">If any check fails, or the model is slow, refuses or unavailable, the platform uses its own top-ranked supplier and</text>
  <text x="894" y="800" class="tiny">records that it did. <tspan font-weight="700">With the model switched off entirely, the product still works.</tspan></text>

  <circle cx="1576" cy="586" r="15" class="num"/><text x="1576" y="591" class="numt">5</text>

  <path d="M 830 692 L 856 692" class="flow"/>
  <text x="836" y="682" class="tiny">shortlist</text>
  <path d="M 856 712 L 830 712" class="flowback"/>
  <text x="836" y="730" class="tiny">choice, then re-checked</text>

  <!-- ─────────────── 5. services ─────────────── -->
  <path d="M 420 826 L 420 866" class="flow"/>
  <path d="M 1180 826 L 1180 866" class="flow"/>

  <text x="40" y="884" class="lbl">WHAT ACTUALLY HAPPENS — transactional services</text>
  <rect x="40" y="896" width="1560" height="92" class="band" rx="3"/>

  <rect x="58" y="912" width="238" height="60" class="inner" rx="3"/>
  <text x="72" y="933" class="hs">Offers</text>
  <text x="72" y="953" class="tiny">sent one supplier at a time, each</text>
  <text x="72" y="968" class="tiny">with an acknowledgement deadline</text>

  <rect x="316" y="912" width="238" height="60" class="inner" rx="3"/>
  <text x="330" y="933" class="hs">Assignments</text>
  <text x="330" y="953" class="tiny">the real vehicle, driver, officer,</text>
  <text x="330" y="968" class="tiny">room, uplift or hangar bay</text>

  <rect x="574" y="912" width="238" height="60" class="inner" rx="3"/>
  <text x="588" y="933" class="hs">Interventions</text>
  <text x="588" y="953" class="tiny">override, force a status, cancel —</text>
  <text x="588" y="968" class="tiny">each one requires a written reason</text>

  <rect x="832" y="912" width="238" height="60" class="inner" rx="3"/>
  <text x="846" y="933" class="hs">Messaging</text>
  <text x="846" y="953" class="tiny">threads attached to a request,</text>
  <text x="846" y="968" class="tiny">scoped so suppliers stay separate</text>

  <rect x="1090" y="912" width="238" height="60" class="inner" rx="3"/>
  <text x="1104" y="933" class="hs">Documents</text>
  <text x="1104" y="953" class="tiny">confirmations and work orders,</text>
  <text x="1104" y="968" class="tiny">facts taken from structured data</text>

  <rect x="1348" y="912" width="234" height="60" class="inner" rx="3"/>
  <text x="1362" y="933" class="hs">Governance</text>
  <text x="1362" y="953" class="tiny">supplier approval, catalogue,</text>
  <text x="1362" y="968" class="tiny">registry, users, settings</text>

  <circle cx="1576" cy="884" r="15" class="num"/><text x="1576" y="889" class="numt">6</text>

  <!-- ─────────────── 6. data + background ─────────────── -->
  <path d="M 420 988 L 420 1032" class="flow"/>
  <path d="M 1180 988 L 1180 1032" class="flow"/>

  <text x="40" y="1050" class="lbl">WHERE THE TRUTH LIVES</text>

  <rect x="40" y="1062" width="900" height="208" class="band" rx="3"/>
  <text x="60" y="1090" class="hs">PostgreSQL — the final authority</text>
  <text x="60" y="1111" class="ts">42 tables. Hand-written migrations, applied in order and checksummed.</text>

  <rect x="60" y="1126" width="418" height="66" class="innerfill" rx="3"/>
  <text x="74" y="1148" class="hs">The database refuses double-booking</text>
  <text x="74" y="1167" class="tiny">Four exclusion constraints over the committed time range —</text>
  <text x="74" y="1183" class="tiny">vehicle, driver, officer, hangar bay. Not a warning: a refusal.</text>

  <rect x="494" y="1126" width="428" height="66" class="inner" rx="3"/>
  <text x="508" y="1148" class="hs">Written down, not merely done</text>
  <text x="508" y="1167" class="tiny">Every meaningful change records who, what, before, after,</text>
  <text x="508" y="1183" class="tiny">the reason where one is required, and a correlation id.</text>

  <rect x="60" y="1202" width="862" height="52" class="inner" rx="3"/>
  <text x="74" y="1223" class="hs">The complete trail</text>
  <text x="74" y="1243" class="tiny">Audit events · every supplier considered and why each was rejected · every model call with its latency, validation and verification outcome</text>

  <circle cx="916" cy="1090" r="15" class="num"/><text x="916" y="1095" class="numt">7</text>

  <rect x="980" y="1062" width="620" height="208" class="band" rx="3"/>
  <text x="1000" y="1090" class="hs">Background worker — the part nobody watches</text>
  <text x="1000" y="1111" class="ts">A separate process. Redis carries the jobs; three queues, three attempts each.</text>

  <rect x="1000" y="1126" width="186" height="66" class="inner" rx="3"/>
  <text x="1014" y="1147" class="hs">Deadlines</text>
  <text x="1014" y="1166" class="tiny">an offer left unanswered</text>
  <text x="1014" y="1182" class="tiny">expires and re-matches</text>

  <rect x="1202" y="1126" width="186" height="66" class="inner" rx="3"/>
  <text x="1216" y="1147" class="hs">Matching</text>
  <text x="1216" y="1166" class="tiny">finding suppliers, off the</text>
  <text x="1216" y="1182" class="tiny">request's own thread</text>

  <rect x="1404" y="1126" width="178" height="66" class="inner" rx="3"/>
  <text x="1418" y="1147" class="hs">Notifications</text>
  <text x="1418" y="1166" class="tiny">raised, recorded and</text>
  <text x="1418" y="1182" class="tiny">shown in the product</text>

  <rect x="1000" y="1202" width="582" height="52" class="innerfill" rx="3"/>
  <text x="1014" y="1223" class="hs">A retry cannot do the same thing twice</text>
  <text x="1014" y="1243" class="tiny">A key the database enforces as unique. A sweep re-checks deadlines, so an SLA survives a restart.</text>

  <circle cx="1576" cy="1090" r="15" class="num"/><text x="1576" y="1095" class="numt">8</text>

  <!-- ─────────────── flow legend ─────────────── -->
  <line x1="40" y1="1286" x2="1600" y2="1286" class="rule"/>
  <text x="40" y="1310" class="lbl">A REQUEST, END TO END</text>
  <circle cx="51" cy="1331" r="11" class="num"/><text x="51" y="1335" class="numt" font-size="12">1</text>
  <text x="70" y="1328" class="hs" font-size="13.5">Sign in</text>
  <text x="70" y="1344" class="tiny">the portal your role belongs to</text>
  <circle cx="441" cy="1331" r="11" class="num"/><text x="441" y="1335" class="numt" font-size="12">2</text>
  <text x="460" y="1328" class="hs" font-size="13.5">One written sentence</text>
  <text x="460" y="1344" class="tiny">no form, no service codes</text>
  <circle cx="831" cy="1331" r="11" class="num"/><text x="831" y="1335" class="numt" font-size="12">3</text>
  <text x="850" y="1328" class="hs" font-size="13.5">Read back and clarify</text>
  <text x="850" y="1344" class="tiny">ask only what configuration requires</text>
  <circle cx="1221" cy="1331" r="11" class="num"/><text x="1221" y="1335" class="numt" font-size="12">4</text>
  <text x="1240" y="1328" class="hs" font-size="13.5">Who can genuinely cover it</text>
  <text x="1240" y="1344" class="tiny">rules and data, not judgement</text>
  <circle cx="51" cy="1377" r="11" class="num"/><text x="51" y="1381" class="numt" font-size="12">5</text>
  <text x="70" y="1374" class="hs" font-size="13.5">Choose among those</text>
  <text x="70" y="1390" class="tiny">then re-check the choice</text>
  <circle cx="441" cy="1377" r="11" class="num"/><text x="441" y="1381" class="numt" font-size="12">6</text>
  <text x="460" y="1374" class="hs" font-size="13.5">Offer it, with a deadline</text>
  <text x="460" y="1390" class="tiny">one supplier at a time</text>
  <circle cx="831" cy="1377" r="11" class="num"/><text x="831" y="1381" class="numt" font-size="12">7</text>
  <text x="850" y="1374" class="hs" font-size="13.5">Commit real resources</text>
  <text x="850" y="1390" class="tiny">the database refuses a clash</text>
  <circle cx="1221" cy="1377" r="11" class="num"/><text x="1221" y="1381" class="numt" font-size="12">8</text>
  <text x="1240" y="1374" class="hs" font-size="13.5">Chase what went unanswered</text>
  <text x="1240" y="1390" class="tiny">expire, re-match, notify</text>
</svg>
